# tokenrate: token and cost dashboard (last 24 hours, or 7, 30 or 90 days) in a Herdr overlay.
# The pane runs bin/tokenrate from this folder. No network after the one-time
# ccusage install, no background process: the overlay closes when the
# dashboard quits (q). README.md covers install, use and uninstall.
#
# A key binding goes in ~/.config/herdr/config.toml, for example:
#   [[keys.command]]
#   key = "prefix+u"
#   type = "plugin_action"
#   command = "tokenrate.open"
#   description = "token and cost dashboard"
id = "tokenrate"
name = "tokenrate"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Token and cost dashboard over the last 24 hours or 7, 30 or 90 days, from ccusage (API-equivalent estimate)."
platforms = ["macos", "linux"]

# On install and update: put the pinned ccusage in tokenrate's own data folder
# (~/.local/share/tokenrate/ccusage). Without npm it only says so; the
# dashboard then uses a ccusage found on PATH. Build commands run in the
# checkout without HERDR_PLUGIN_ROOT, so the path is relative.
[[build]]
command = ["/bin/sh", "-c", "bin/tokenrate --install-ccusage || true"]

[[panes]]
id = "dashboard"
title = "tokenrate"
placement = "overlay"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/tokenrate\""]

[[actions]]
id = "open"
title = "tokenrate: open token dashboard"
contexts = ["global", "workspace", "tab", "pane"]
command = ["/bin/sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin \"${HERDR_PLUGIN_ID:-tokenrate}\" --entrypoint dashboard --focus"]

# Run before `herdr plugin uninstall tokenrate`: deletes tokenrate's cache and
# its ccusage install, which live outside this plugin folder.
[[actions]]
id = "purge"
title = "tokenrate: delete its cache and ccusage install (before uninstalling)"
contexts = ["global"]
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/tokenrate\" --purge"]
